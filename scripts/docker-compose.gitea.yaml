# Gitea or Forgejo of this project: the product's own image on the project's own PostgreSQL (the container tool's db
# service), served at the project's address; the project's web container keeps the mail catcher. Written by the Gitea
# builder of the workspace (the plugin's docker-compose.gitea.yaml); build again rather than editing by hand. The
# site's own values (its secret key, its internal token) are in gitea/env, which only you can read.
services:
  web:
    environment:
      - HTTP_EXPOSE=8093:80,8025:8025
      - HTTPS_EXPOSE=8457:80,8026:8025
  gitea:
    image: "${GITEA_IMAGE:-gitea/gitea:1.27.3}"
    container_name: ddev-${DDEV_SITENAME}-gitea
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    expose:
      - "3000"
    # The forge migrates its database as it starts: a new project's database is still being made when its containers
    # start, so the forge waits for it to be healthy.
    depends_on:
      db:
        condition: service_healthy
    # The image's own start writes app.ini from these values the first time, then applies its GITEA__ (or FORGEJO__)
    # values at every start, and runs the forge as its git user.
    env_file:
      - ${DDEV_APPROOT}/gitea/env
    volumes:
      - gitea_data:/data
    environment:
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: "80:3000"
      HTTPS_EXPOSE: "443:3000"
# Named after the project, so removing the project removes it with its database, and a new build starts empty.
volumes:
  gitea_data:
    name: ddev-${DDEV_SITENAME}-gitea-data
