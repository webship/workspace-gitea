# Labels for core/config/plugin.gitea.settings.yml, merged into the Settings page.
url:
  label: Gitea or Forgejo address
  info: 'Your own instance: https://<name>.ddev.site for a site the builder made, or your own Gitea or Forgejo. No trailing slash. A project whose git remote is at this address gets the forge''s menu.'
product:
  label: Product
  info: 'Gitea, or Forgejo (the fork of Gitea that keeps its API): the name the menu and the messages carry. The plugin works the same for both.'
  options:
    gitea: "Gitea (default)"
    forgejo: "Forgejo"
username:
  label: Username
  info: 'The account name the forge knows you by.'
email:
  label: Commit email
  info: 'The address commits pushed there carry. Blank falls back to contributor.email.'
token:
  label: Access token
  info: 'An access token of that account (Settings → Applications → Generate token) with write:issue, write:repository and read:user. Never printed; cmd-tools-gitea-cli.sh <site> --connect <login> writes one for a site the builder made.'
tracker.allow_writes:
  label: Writes to the forge (issues as work items)
  info: 'Off: the AI works on a branch and nothing leaves this machine. On: you may push the branch and open a pull request, comment, log time, close and reopen, label and assign, each a click after a preview, each a line in actions.log.'
  options:
    "false": "Off — nothing is written to the forge (default)"
    "true": "On — each write is your click after a preview"
tracker.max_agents:
  label: Author sessions at once
  info: 'How many AI sessions may work issues at the same time. Each is a whole session in a project.'
  number: { min: 1, max: 8, step: 1 }
tracker.default_scope:
  label: Default repository for issues
  info: 'owner/name: the repository a workspace project works against when its own remote is not on this forge and it remembers none.'
tracker.scopes:
  label: Repositories the issues list may switch to
  info: 'A list of owner/name. Empty is any. Edit it in the Raw YAML tab.'
tracker.work_in:
  label: Where the AI works
  info: 'A new branch in the project (a running site shows the change), or a git worktree outside the workspace folders (the project stays as it is).'
  options:
    branch: "A branch in the project (default)"
    worktree: "A worktree outside the workspace folders"
tracker.sandbox:
  label: Sandbox for the author session
  info: 'Required: Claude Code''s sandboxed Bash (no network, credentials denied), and no session without it. On Ubuntu 24.04 bubblewrap needs its AppArmor profile (see the tracker''s README). Off: your choice, said in the form.'
  options:
    required: "Required (default)"
    "off": "Off — the session is not sandboxed"
tracker.network_domains:
  label: Domains the sandbox allows
  info: 'The package registries the project needs (registry.npmjs.org, repo.packagist.org…). None by default. Edit it in the Raw YAML tab.'
tracker.allow_web:
  label: Web tools in the author session
  info: 'WebFetch and WebSearch. Off by default: a link in an issue is not opened.'
  options:
    "false": "Off (default)"
    "true": "On"
tracker.comments_from:
  label: Comments the AI reads
  info: 'Members: only comments by the owner and those with write access (default). All, or none.'
  options:
    members: "Write access and above (default)"
    all: "All comments"
    none: "No comments"
tracker.outsider_items:
  label: Issues from outside the repository
  info: 'Opened by someone with read access or none. Analyze: analyze only, unless you tick a confirmation that names them. Refuse: analyze only.'
  options:
    analyze: "Analyze only, unless confirmed by name (default)"
    refuse: "Analyze only"
tracker.draft:
  label: Draft pull requests
  info: 'Open the pull request as a draft (its title starts with WIP:), so it cannot be merged by accident.'
  options:
    "true": "Drafts (default)"
    "false": "Ready for review"
