# Gitea and Forgejo — core/config/plugin.gitea.settings.yml
#
# How the dashboard reaches your own Gitea or Forgejo (one plugin serves both: Forgejo keeps Gitea's API): a site the
# builder made (https://<name>.ddev.site), or your own instance. The token is an access token of an account there
# (Settings → Applications) with write:issue, write:repository and read:user. Never printed.
# The address of the Gitea or Forgejo, without a trailing slash.
url: CHANGE_ME
# gitea or forgejo: the name the menu and the messages carry.
product: gitea
# The account name the forge knows you by.
username: CHANGE_ME
# The address commits pushed there carry. Blank falls back to contributor.email.
email: CHANGE_ME
# An access token of that account (Settings → Applications): write:issue, write:repository, read:user.
token: CHANGE_ME
# The issues as work items (the tracker family): read one, analyze it, have the workspace's AI CLI work it on a
# branch in a screen session you watch, then, with writes on, push the branch and open a pull request, comment, log
# time and close it, each a click after a preview. See @webship.co/workspace-tracker for every key.
tracker:
  # Writes to the forge: push and pull request, comments, tracked time, close and reopen, labels, assignee, new issues. Off by default.
  allow_writes: false
  # Author sessions at once.
  max_agents: 1
  # The repository a workspace project works against when its remote is not on this forge and it remembers none (owner/name).
  default_scope: ""
  # The repositories the list may be switched to (owner/name); empty is any.
  scopes: []
  # branch: a new branch in the project; worktree: a git worktree outside the workspace folders.
  work_in: branch
  # required: Claude Code's sandbox for the author session, and no session without it; off: a person's choice.
  sandbox: required
  # Domains the sandbox allows (the project's package registries).
  network_domains: []
  # WebFetch and WebSearch in the author session.
  allow_web: false
  # The comments an issue's snapshot keeps: members (write access and above), all, none.
  comments_from: members
  # An issue from outside the repository (read access or none): analyze (work it only after a confirmation that names its author) or refuse.
  outsider_items: analyze
  # Open pull requests as drafts (their title starts with WIP:).
  draft: true
